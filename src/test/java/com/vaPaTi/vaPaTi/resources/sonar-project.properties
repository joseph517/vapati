sonar.projectKey=vapati
sonar.projectName=vaPaTi
sonar.projectVersion=1.0

# Paths
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# Coverage
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.java.coveragePlugin=jacoco

# Exclude DTOs
sonar.exclusions=\
src/main/java/com/vaPaTi/vaPaTi/dtos/**,\
src/main/java/com/vaPaTi/vaPaTi/exception/**,\
src/main/java/com/vaPaTi/vaPaTi/utils/**,\
src/main/java/com/vaPaTi/vaPaTi/validation/**,\
src/main/java/com/vaPaTi/vaPaTi/security/**,\
src/main/java/com/vaPaTi/vaPaTi/controller/**,\
src/main/java/com/vaPaTi/vaPaTi/mapper/**,\
src/main/java/com/vaPaTi/vaPaTi/entity/**,\
src/main/java/com/vaPaTi/vaPaTi/repository/**
