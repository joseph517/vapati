# Test Configuration for VaPaTi Application
spring.application.name=vaPaTi-test

# Test Database Configuration (will be overridden by TestContainers)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for Testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# JWT Configuration for Testing
jwt.secret=test-secret-key-for-testing-purposes-should-be-long-enough-for-512-bit
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Disable security for specific tests (can be overridden in test classes)
spring.security.enabled=true

# Test specific configurations
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=true

# Logging configuration (minimized for faster test execution)
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
logging.level.org.hibernate=WARN

# Error handling configuration
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false

# Disable banner for cleaner test output
spring.main.banner-mode=off

# Test performance optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

