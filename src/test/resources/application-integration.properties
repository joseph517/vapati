# Integration Test Configuration for VaPaTi Application
spring.application.name=vaPaTi-integration-test

# TestContainers will override these database settings
# These are placeholder values for integration tests
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=TestDB;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=TestPassword123!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration for Integration Testing
# Use 'none' because we provide our own schema.sql script
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration for Integration Testing
jwt.secret=integration-test-secret-key-for-testing-purposes-should-be-long-enough-for-512-bit
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# TestContainers Configuration
spring.test.database.replace=none
spring.jpa.defer-datasource-initialization=true

# Transaction management for integration tests
spring.jpa.properties.hibernate.connection.autocommit=false
spring.transaction.default-timeout=30

# Connection pool settings for testing
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Logging configuration for integration tests
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Error handling configuration
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false

# Disable banner for cleaner test output
spring.main.banner-mode=off

# Performance optimizations for integration tests
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# TestContainers specific settings
testcontainers.reuse.enable=true