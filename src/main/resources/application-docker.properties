# Docker Profile Configuration for VaPaTi
spring.application.name=vaPaTi

# Database Configuration for Docker
# Use 'sqlserver' as hostname (service name in docker-compose)
spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=ApiVaPaTiJava;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=TuContrasenaSegura!
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=your-512-bit-secret-key-should-be-long-and-random
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Error handling configuration
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false

# Server configuration for Docker
server.port=8080
server.address=0.0.0.0

# DevTools configuration for hot reload
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.livereload.enabled=true

# Logging configuration
logging.level.com.vaPaTi.vaPaTi=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
