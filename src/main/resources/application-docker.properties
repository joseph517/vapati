# Docker Profile Configuration for VaPaTi
spring.application.name=vaPaTi

# Database Configuration for Docker
# Use 'sqlserver' as hostname (service name in docker-compose)
spring.datasource.url=jdbc:sqlserver://sqlserver:1433;databaseName=ApiVaPaTiJava;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:TuContrasenaSegura!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Seed de datos iniciales (roles, categorias) via data.sql, ejecutado despues de que Hibernate cree el esquema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Error handling configuration
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false

# Server configuration for Docker
server.port=8080
server.address=0.0.0.0

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# DevTools configuration for hot reload
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.livereload.enabled=true

# Logging configuration
logging.level.com.vaPaTi.vaPaTi=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# Test configuration (used when running tests with docker profile)
# Tests will use create-drop for clean state between test runs
# This is overridden by @DataJpaTest which manages transactions
spring.test.database.replace=none
