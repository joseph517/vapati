spring.application.name=vaPaTi
# Puerto

# conection DB
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ApiVaPaTiJava;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:TuContrasenaSegura!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Seed de datos iniciales (roles, categorias) via data.sql, ejecutado despues de que Hibernate cree el esquema
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT CONFIG
jwt.secret=${JWT_SECRET:your-512-bit-secret-key-should-be-long-and-random}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Disable stack trace in error responses
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-exception=false

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}