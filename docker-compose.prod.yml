services:
  sqlserver:
    container_name: db_vapati_prod
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    ports:
      - "${DB_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      MSSQL_MEMORY_LIMIT_MB: "1024"
    volumes:
      - sql_data_apivapati_java:/var/opt/mssql
    command:
      - bash
      - -c
      - |
        /opt/mssql/bin/sqlservr &
        sqlcmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b"
        until $$sqlcmd -P "$$DB_PASSWORD" -Q "SELECT 1" >/dev/null 2>&1; do echo "waiting for SQL Server..."; sleep 2; done
        $$sqlcmd -P "$$DB_PASSWORD" -Q "EXEC sp_configure 'show advanced options', 1; RECONFIGURE; EXEC sp_configure 'max server memory (MB)', 512; RECONFIGURE; IF DB_ID('ApiVaPaTiJava') IS NULL CREATE DATABASE ApiVaPaTiJava;"
        $$sqlcmd -P "$$DB_PASSWORD" -Q "IF SUSER_ID('vapati_app') IS NULL CREATE LOGIN vapati_app WITH PASSWORD = '$$DB_APP_PASSWORD', DEFAULT_DATABASE = ApiVaPaTiJava; ELSE ALTER LOGIN vapati_app WITH PASSWORD = '$$DB_APP_PASSWORD';"
        $$sqlcmd -P "$$DB_PASSWORD" -d ApiVaPaTiJava -Q "IF USER_ID('vapati_app') IS NULL CREATE USER vapati_app FOR LOGIN vapati_app WITH DEFAULT_SCHEMA = dbo; ALTER ROLE db_owner ADD MEMBER vapati_app;"
        wait
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U vapati_app -P \"$$DB_APP_PASSWORD\" -d ApiVaPaTiJava -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vapati-network

  app:
    container_name: app_vapati_prod
    image: ${IMAGE_NAME:-app_vapati_prod}:${IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?DB_APP_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      # Any HTTP response (401 included) counts as healthy; no response, unhealthy
      test: ["CMD-SHELL", "wget -S -O /dev/null http://localhost:$${SERVER_PORT:-8080}/ 2>&1 | grep -q 'HTTP/'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - vapati-network
    restart: unless-stopped

volumes:
  sql_data_apivapati_java:
    external: true
    name: sql_data_apivapati_java

networks:
  vapati-network:
    driver: bridge
