# Publishes the production image to Docker Hub.
#
# - PR to main          -> only runs the tests (the check required by main branch protection).
# - push/merge to main  -> tests + publishes <username>/vapati:latest.
# - push of tag vX.Y.Z  -> tests + publishes <username>/vapati:X.Y.Z and :X.Y.
#
# Requires in GitHub (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret. See DOCKER-HUB-DEPLOY.md, section 7.
name: Publish image to Docker Hub

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Two consecutive publications do not overlap: the second waits for the first to finish.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Includes integration tests (Testcontainers + MSSQL); the runner already has Docker.
      - name: Run tests
        run: ./mvnw -B test -Ddocker.remote.api.version="$(docker version --format '{{.Server.APIVersion}}')"

  publish:
    name: Build & push
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/vapati
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Disabled: also tag every image with sha-<commit> (one extra tag per merge).
            # Uncomment to be able to roll back to merges that have no vX.Y.Z version.
            # type=sha

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
