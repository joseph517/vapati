services:
  sqlserver:
    container_name: apivapati_java_db
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TuContrasenaSegura!"
    volumes:
      - sql_data_apivapati_java:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TuContrasenaSegura!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - vapati-network

  app:
    container_name: apivapati_java_app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
    volumes:
      # For hot reload - mount source code
      - ./src:/app/src:ro
      - ./target:/app/target
      - maven-cache:/root/.m2
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - vapati-network
    restart: unless-stopped

volumes:
  sql_data_apivapati_java:
    external: true
    name: sql_data_apivapati_java
  maven-cache:
    driver: local

networks:
  vapati-network:
    driver: bridge
