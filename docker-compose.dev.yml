# Docker Compose for Development with Hot Reload
# Use: docker-compose -f docker-compose.dev.yml up

services:
  sqlserver:
    container_name: apivapati_java_db_dev
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "TuContrasenaSegura!"
    volumes:
      - sql_data_apivapati_java:/var/opt/mssql
      - ./init-db.sql:/init-db.sql
      - ./init-db.sh:/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TuContrasenaSegura!' -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      bash -c "
        /opt/mssql/bin/sqlservr &
        sleep 20s &&
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TuContrasenaSegura!' -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'ApiVaPaTiJava') CREATE DATABASE ApiVaPaTiJava\" -C &&
        wait
      "
    networks:
      - vapati-network-dev

  app-dev:
    container_name: apivapati_java_app_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "false"
    volumes:
      - ./src:/app/src:rw
      - ./pom.xml:/app/pom.xml:ro
      - /app/target
      - maven-cache-dev:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - vapati-network-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  postgres-sonar:
    profiles: ["sonar"]
    container_name: apivapati_sonar_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    networks:
      - vapati-network-dev
    restart: unless-stopped

  sonarqube:
    profiles: ["sonar"]
    container_name: apivapati_sonarqube
    image: sonarqube:10.4-community
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - postgres-sonar
    networks:
      - vapati-network-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  sql_data_apivapati_java:
    # external: true
    name: sql_data_apivapati_java
  maven-cache-dev:
    driver: local
  postgres_sonar_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local

networks:
  vapati-network-dev:
    driver: bridge
