# Docker Compose for Development with Hot Reload
# Use: docker compose -f docker-compose.dev.yml up -d  (hot reload is built in, see app-dev)

services:
  sqlserver:
    container_name: db_vapati_dev
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "${DB_PORT:-1433}:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - sql_data_apivapati_java:/var/opt/mssql
      - ./init-db.sql:/init-db.sql
      - ./init-db.sh:/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P $$DB_PASSWORD -Q 'SELECT 1' -C || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: >
      bash -c "
        /opt/mssql/bin/sqlservr &
        sleep 20s &&
        /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$DB_PASSWORD\" -Q \"IF NOT EXISTS (SELECT name FROM sys.databases WHERE name = 'ApiVaPaTiJava') CREATE DATABASE ApiVaPaTiJava\" -C &&
        wait
      "
    networks:
      - vapati-network-dev

  app-dev:
    container_name: app_vapati_dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${APP_PORT:-8080}:${SERVER_PORT:-8080}"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DEVTOOLS_RESTART_ENABLED: "true"
      SPRING_DEVTOOLS_LIVERELOAD_ENABLED: "true"
      # DevTools only restarts when this file changes, i.e. after a successful compile (see scripts/dev-hot-reload.sh)
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: .reloadtrigger
      DOCKER_HOST: unix:///var/run/docker.sock
      TESTCONTAINERS_RYUK_DISABLED: "false"
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    # Hot reload (no Compose Watch): ./src and the project dir are mounted read-only, and
    # scripts/dev-hot-reload.sh (the container's CMD) recompiles on every save in src/main and
    # restarts the app; a pom.xml change downloads only the missing dependencies and restarts the Java process.
    # target/ stays inside the container. A failed compile keeps the previous version running,
    # prints a banner in the logs and marks the container unhealthy.
    volumes:
      - ./src:/app/src:ro
      # pom.xml is read through its directory: a single-file bind mount misses editors' atomic saves
      - ./:/workspace:ro
      - maven-cache-dev:/root/.m2
      - /var/run/docker.sock:/var/run/docker.sock
    # tini as PID 1: forwards SIGTERM to the watcher script and reaps child processes
    init: true
    healthcheck:
      # Unhealthy if the last compile failed or the app does not answer HTTP (any status code, 401 included)
      test: ["CMD-SHELL", "test ! -e /tmp/hot-reload/failed && curl -s -o /dev/null http://localhost:$${SERVER_PORT:-8080}/"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The first start compiles everything
      start_period: 180s
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - vapati-network-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  postgres-sonar:
    profiles: ["sonar"]
    container_name: apivapati_sonar_db
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonarqube
    volumes:
      - postgres_sonar_data:/var/lib/postgresql/data
    networks:
      - vapati-network-dev
    restart: unless-stopped

  sonarqube:
    profiles: ["sonar"]
    container_name: apivapati_sonarqube
    image: sonarqube:10.4-community
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    depends_on:
      - postgres-sonar
    networks:
      - vapati-network-dev
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

volumes:
  sql_data_apivapati_java:
    # external: true
    name: sql_data_apivapati_java
  maven-cache-dev:
    driver: local
  postgres_sonar_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local

networks:
  vapati-network-dev:
    driver: bridge
